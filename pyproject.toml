[project]
name = "ophanim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "pillow>=12.3.0",
    "PyYAML>=6.0.3",
    "boto3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests",
    "onnx>=1.22.0",
    "onnxslim>=0.1.96",
    "pytest-benchmark>=4.0.0",
    "psutil>=5.9.0",
    "ruff>=0.16.4",
    "ty>=0.0.73",
    "openapi-spec-validator>=0.9.0",
]

[tool.ruff.lint]
# ruff 0.16 expanded the default rule set from 59 to 413 rules; pin back to
# the pre-0.16 default (E4, E7, E9, F) so the bump doesn't fail CI on
# previously-unselected rules. See https://astral.sh/blog/ruff-v0.16.0
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["."]
include = ["detection*"]
namespaces = false
